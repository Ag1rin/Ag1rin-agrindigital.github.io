<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>خولی کۆمپیوتەر و بەرنامەنووسین | دوره مفاهیم پایه کامپیوتر و برنامه‌نویسی</title>
<meta name="description" content="دوره حضوری مفاهیم پایه کامپیوتر و برنامه‌نویسی برای مبتدیان، ۱۲ جلسه، به زبان فارسی و کوردی">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preload" href="fonts/Vazirmatn-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Vazirmatn-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* ============ LOCAL FONTS — Vazirmatn (no Google Fonts — faster in IR) ============ */
@font-face{
  font-family:'Vazirmatn';
  src:url('fonts/Vazirmatn-Regular.ttf') format('truetype');
  font-weight:100 450;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('fonts/Vazirmatn-Medium.ttf') format('truetype');
  font-weight:451 550;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('fonts/Vazirmatn-SemiBold.ttf') format('truetype');
  font-weight:551 900;
  font-style:normal;
  font-display:swap;
}
/* ============ TOKENS ============ */
:root{
  --ink-900:#0F1417;
  --ink-800:#171D21;
  --ink-700:#202830;
  --paper-100:#EDEEE8;
  --paper-50:#F7F7F3;
  --copper:#D8935A;
  --copper-dark:#B5672E;
  --teal:#5FC3B0;
  --teal-dark:#2E8B7A;
  --red-soft:#D8735A;

  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --maxw:1140px;

  --font-display:'Vazirmatn', Tahoma, sans-serif;
  --font-body:'Vazirmatn', Tahoma, sans-serif;
  --font-mono:'Vazirmatn', Tahoma, sans-serif;
}
html.dark{
  --bg:var(--ink-900);
  --surface:var(--ink-800);
  --surface-2:var(--ink-700);
  --text:#ECEEE9;
  --text-dim:#9BA8A4;
  --border:#2A3339;
  --accent:var(--copper);
  --accent-2:var(--teal);
  --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
}
html.light{
  --bg:var(--paper-100);
  --surface:var(--paper-50);
  --surface-2:#FFFFFF;
  --text:#171D21;
  --text-dim:#5C6A64;
  --border:#DADCD3;
  --accent:var(--copper-dark);
  --accent-2:var(--teal-dark);
  --shadow: 0 20px 50px -22px rgba(20,30,25,0.22);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
#syllabus,#pricing,#form{scroll-margin-top:88px;}
html,body{overflow-x:hidden;overflow-x:clip;width:100%;max-width:100vw;position:relative;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.75;
  transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.mono{font-family:var(--font-mono);}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--accent);display:inline-block;}
html[dir="rtl"] .eyebrow{letter-spacing:0;}

h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;letter-spacing:-.01em;}
h2{font-size:clamp(26px,4vw,38px);}
h3{font-size:19px;font-weight:700;}
p{color:var(--text-dim);margin:0;}
.section{padding:96px 0;border-top:1px solid var(--border);}
.section-head{max-width:640px;margin-bottom:52px;}
.section-head p{margin-top:14px;font-size:16.5px;}
#form.section{padding-bottom:72px;}

button,a,.check-item,.icon-btn,.nav-cta,.btn-primary,.btn-ghost{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px) saturate(140%);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:var(--maxw);margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:0;flex:1;}
.brand img{width:46px;height:46px;border-radius:50%;flex:none;border:1.5px solid var(--border);transition:transform .45s cubic-bezier(.34,1.56,.64,1),border-color .3s ease;}
.brand:hover img{transform:scale(1.08) rotate(-6deg);border-color:var(--accent);}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg);}
.brand-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
.brand-text [data-i18n="brand"]{line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.brand-sub{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--text-dim);letter-spacing:0;}
.top-actions{display:flex;align-items:center;gap:8px;flex:none;}
.pill-toggle{
  display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;
}
.pill-toggle button{
  font-family:var(--font-mono);font-size:12px;padding:7px 13px;border-radius:999px;border:none;
  background:transparent;color:var(--text-dim);cursor:pointer;transition:.2s;
}
.pill-toggle button.active{background:var(--accent);color:var(--ink-900);font-weight:600;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
  transition:transform .3s ease,border-color .3s ease;
}
.icon-btn:hover{transform:rotate(18deg);border-color:var(--accent);}
.icon-btn svg{width:17px;height:17px;}
.nav-cta{
  font-size:13.5px;font-weight:700;background:var(--accent-2);color:var(--ink-900);padding:9px 18px;border-radius:10px;
  transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
  box-shadow:0 10px 22px -14px color-mix(in srgb, var(--accent-2) 70%, transparent);
}
.nav-cta:hover{transform:translateY(-1px);filter:brightness(1.05);}

/* ============ HERO ============ */
.hero{padding:74px 0 40px;position:relative;overflow:hidden;}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
.hero h1{font-size:clamp(32px,5.2vw,54px);line-height:1.22;}
.hero h1 .accent{color:var(--accent);}
.hero-sub{font-size:17.5px;margin-top:20px;max-width:480px;}
.hero-stats{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:22px;color:var(--text);}
.hero-stat span{font-size:12.5px;color:var(--text-dim);}
.hero-actions{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap;}
.btn-primary{
  background:var(--accent);color:var(--ink-900);font-weight:700;padding:14px 26px;border-radius:12px;
  border:none;cursor:pointer;font-size:15px;font-family:var(--font-body);
  box-shadow:0 14px 30px -14px color-mix(in srgb, var(--accent) 70%, transparent);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease;
}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 18px 34px -14px color-mix(in srgb, var(--accent) 80%, transparent);}
.btn-primary:active{transform:translateY(0) scale(.98);}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{
  padding:14px 22px;border-radius:12px;border:1px solid var(--border);font-weight:600;font-size:15px;
  background:transparent;color:var(--text);cursor:pointer;font-family:var(--font-body);
  transition:transform .25s ease,border-color .25s ease,background .25s ease;
}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}

/* flowchart hero graphic */
.flow-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:26px;box-shadow:var(--shadow);}
.flow-svg{width:100%;height:auto;}
.flow-node-label{font-family:var(--font-mono);font-size:11.5px;fill:var(--text);}
.flow-node-sub{font-family:var(--font-mono);font-size:9.5px;fill:var(--text-dim);}
.flow-line{stroke:var(--accent-2);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:flowmove 2.6s linear infinite;}
@keyframes flowmove{to{stroke-dashoffset:-24;}}
.flow-shape{fill:var(--surface-2);stroke:var(--border);stroke-width:1.4;transition:stroke .3s ease;}
.flow-shape.on{stroke:var(--accent);}
#flowGo{animation:goPulse 1.8s ease-in-out infinite;transform-origin:190px 392px;}
@keyframes goPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:.7;}}

/* ============ MARQUEE / STRIP ============ */
.strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);}
.strip-inner{max-width:var(--maxw);margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;}
.strip-item{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);}
.strip-item b{font-size:13.5px;color:var(--text);}
.strip-item span{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;}

/* ============ AUDIENCE ============ */
.audience-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.aud-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:22px 20px;
  display:flex;gap:14px;align-items:flex-start;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}
.aud-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow);}
.aud-card .mark{
  flex:none;width:30px;height:30px;border-radius:8px;background:color-mix(in srgb, var(--accent) 16%, transparent);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;
}
.aud-card p{color:var(--text);font-size:15px;}

/* ============ SYLLABUS as flowchart ============ */
.parts-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px;}
.part-chip{
  font-family:var(--font-mono);font-size:12.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  color:var(--text);font-weight:600;background:var(--surface);transition:border-color .25s ease,transform .25s ease;
}
.part-chip:hover{border-color:var(--accent);transform:translateY(-2px);}
.syllabus-track{position:relative;padding-inline-start:0;}
.syllabus-track::before{
  content:"";position:absolute;top:8px;bottom:8px;inset-inline-start:29px;width:2px;
  background:repeating-linear-gradient(var(--accent-2),var(--accent-2) 6px, transparent 6px, transparent 12px);
}
.session{position:relative;padding-inline-start:76px;padding-bottom:40px;}
.session:last-child{padding-bottom:0;}
.session-node{
  position:absolute;inset-inline-start:0;top:0;width:60px;height:60px;border-radius:16px;
  background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--accent);
}
.session-part-label{font-family:var(--font-mono);font-size:11px;color:var(--accent-2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:none;}
.session-part-label.show{display:block;}
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:22px 24px;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;}
.session-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow);}
.session-node{transition:transform .3s ease,border-color .3s ease;}
.session:hover .session-node{transform:scale(1.08);border-color:var(--accent);}
.session-card h3{margin-bottom:4px;}
.session-topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.topic-tag{
  font-family:var(--font-mono);font-size:11.5px;padding:5px 10px;border-radius:7px;background:var(--surface-2);
  color:var(--text);font-weight:500;border:1px solid var(--border);transition:border-color .25s ease,color .25s ease;
}
.topic-tag:hover{border-color:var(--accent-2);color:var(--accent-2);}
.session-ex{
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);font-size:14px;
  display:flex;gap:8px;
}
.session-ex b{color:var(--text);flex:none;}

/* ============ PROJECT SHOWCASE ============ */
.project-panel{
  background:linear-gradient(160deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);border-radius:var(--radius-l);padding:40px;
  display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;
}
.terminal{
  background:var(--ink-900);border-radius:var(--radius-m);border:1px solid var(--border);overflow:hidden;
  box-shadow:var(--shadow);
}
.terminal-bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid #2A3339;}
.terminal-bar span{width:9px;height:9px;border-radius:50%;background:#3A454B;}
.terminal pre{margin:0;padding:20px;color:#CFE8DE;font-family:var(--font-mono);font-size:13px;line-height:1.9;direction:ltr;text-align:left;overflow-x:auto;}
.terminal .kw{color:var(--copper);}
.terminal .str{color:var(--teal);}
.terminal .cm{color:#5C6A64;}
.feature-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
.feature-list li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--text);}
.feature-list li svg{flex:none;width:16px;height:16px;margin-top:4px;color:var(--accent-2);}

/* ============ METHOD ============ */
.formula{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--font-mono);font-size:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:22px;margin-bottom:34px;
}
.formula span.step{padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);}
.formula span.arrow{color:var(--accent);}
.method-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.method-cell{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;}
.method-cell b{display:block;font-family:var(--font-mono);color:var(--accent);font-size:13px;margin-bottom:4px;}
.method-cell span{font-size:11.5px;color:var(--text-dim);}

/* ============ INSTRUCTOR ============ */
.instructor-panel{
  background:linear-gradient(160deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);border-radius:var(--radius-l);padding:40px;
  display:flex;align-items:center;gap:36px;
}
.instructor-avatar{
  flex:none;width:150px;height:150px;border-radius:50%;overflow:hidden;
  border:2px solid var(--accent);box-shadow:var(--shadow);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.instructor-panel:hover .instructor-avatar{transform:scale(1.05) rotate(-3deg);}
.instructor-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.instructor-info h3{font-size:23px;margin-bottom:6px;}
.instructor-role{font-family:var(--font-mono);font-size:13px;color:var(--accent-2);margin-bottom:10px;display:block;}
.instructor-info p.instructor-bio{color:var(--text-dim);font-size:15px;max-width:560px;margin-top:12px;}
.instructor-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.instructor-badge{
  font-family:var(--font-mono);font-size:12px;padding:7px 13px;border-radius:999px;
  background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);border:1px solid var(--border);
  display:flex;align-items:center;gap:6px;
}
.instructor-badge svg{width:13px;height:13px;flex:none;}
.instructor-github{
  margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 16px;
  transition:border-color .25s ease,transform .25s ease,background .25s ease;
}
.instructor-github:hover{border-color:var(--accent);transform:translateY(-2px);background:var(--surface-2);}
@media (max-width:640px){
  .instructor-panel{flex-direction:column;text-align:center;padding:22px 18px;gap:18px;}
  .instructor-avatar{width:112px;height:112px;}
  .instructor-info p.instructor-bio{max-width:none;}
  .instructor-badges{justify-content:center;}
}

/* ============ PRICING ============ */
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.price-card{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:30px 26px;overflow:hidden;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease,opacity .3s ease;
}
.price-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
.price-card.is-full{opacity:.55;filter:grayscale(.5);}
.price-card.is-full::before{background:var(--text-dim) !important;}
.price-card.featured{border-color:var(--accent);}
.price-card.featured::before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--accent);
}
.price-badge{
  display:inline-flex;font-family:var(--font-mono);font-size:11px;padding:4px 10px;border-radius:999px;
  background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);margin-bottom:16px;
}
.price-amount{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-weight:800;font-size:32px;}
.price-amount .unit{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--text-dim);}
.price-card p.price-desc{margin-top:10px;font-size:14px;}
.pay-note{
  margin-top:22px;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px dashed var(--accent-2);
  border-radius:var(--radius-m);padding:20px 22px;
}
.pay-note svg{flex:none;width:22px;height:22px;color:var(--accent-2);margin-top:2px;}
.pay-note p{color:var(--text);font-size:14.5px;}
.pay-note b{color:var(--accent-2);}

/* ============ FORM ============ */
.form-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:44px;box-shadow:var(--shadow);
}
.reg-price-box{
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent-2) 10%, transparent));
  border:1px solid var(--accent);border-radius:var(--radius-m);padding:20px 24px;margin-bottom:30px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  animation:rpPulse 3s ease-in-out infinite;
}
@keyframes rpPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 25%, transparent);}50%{box-shadow:0 0 0 8px transparent;}}
.reg-price-box .rp-label{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.04em;}
.reg-price-box .rp-amount{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--text);display:flex;align-items:baseline;gap:6px;}
.reg-price-box .rp-amount .unit{font-size:13px;font-weight:500;color:var(--text-dim);font-family:var(--font-mono);}
.reg-price-box .rp-seats{font-family:var(--font-mono);font-size:12.5px;padding:7px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--accent-2);white-space:nowrap;}
.reg-price-box.is-full{border-color:var(--border);background:var(--surface-2);animation:none;}
.reg-price-box.is-full .rp-amount{color:var(--text-dim);font-size:16.5px;font-weight:700;}
.reg-price-box.is-full .rp-seats{color:var(--text-dim);max-width:280px;white-space:normal;line-height:1.5;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:8px;}
.field label{font-size:13px;font-weight:600;color:var(--text);}
.field input:not([type="checkbox"]),.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  color:var(--text);font-family:var(--font-body);font-size:16px;outline:none;width:100%;
  -webkit-appearance:none;appearance:none;
}
.field select{
  background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) calc(50% - 3px),calc(100% - 12px) calc(50% - 3px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-inline-end:36px;
}
html[dir="rtl"] .field select{
  background-position:18px calc(50% - 3px),12px calc(50% - 3px);
}
.field input:not([type="checkbox"]):focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.check-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.check-item{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:13.5px;cursor:pointer;user-select:none;
  transition:border-color .2s ease,background .2s ease,color .2s ease;
  font-family:var(--font-body);
}
.check-item:hover{border-color:color-mix(in srgb, var(--accent) 55%, var(--border));}
.check-item.is-on,.check-item:has(input:checked){
  border-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 18%, var(--surface-2));
  color:var(--text);
}
.check-item input[type="checkbox"]{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;margin:0;flex:none;
  border:1.5px solid var(--border);border-radius:5px;background:var(--surface);
  display:grid;place-content:center;cursor:pointer;
  transition:border-color .2s ease,background .2s ease;
}
.check-item input[type="checkbox"]::before{
  content:"";width:10px;height:10px;transform:scale(0);
  clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%);
  background:var(--ink-900);transition:transform .15s ease;
}
.check-item input[type="checkbox"]:checked{
  background:var(--accent);border-color:var(--accent);
}
.check-item input[type="checkbox"]:checked::before{transform:scale(1);}
.form-note{font-size:12.5px;color:var(--text-dim);margin-top:18px;}
.submit-row{margin-top:26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hp-field{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
#formMsg{font-size:14px;font-weight:600;}
#formMsg.ok{color:var(--accent-2);}
#formMsg.err{color:var(--red-soft);}
.reg-done{
  display:none;text-align:center;padding:28px 12px 8px;
}
.form-panel.is-registered .reg-done{display:block;}
.form-panel.is-registered #regForm{display:none;}
.reg-done-icon{

.reg-done p{color:var(--text-dim);font-size:14.5px;max-width:420px;margin:0 auto;line-height:1.7;}

/* reveal on scroll — only hide after JS marks page ready (avoids blank stuck page) */
.js-ready .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease, transform .6s ease;}
.js-ready .reveal.in,.reveal.in{opacity:1;transform:none;}

/* ============================================================
   SEAT / PRICING TRACKER
   تعداد ثبت‌نام‌ها از Supabase خوانده می‌شود (تابع registration_count).
   اگر config تنظیم نشده باشد، از seatsFilledFallback استفاده می‌شود.
   ============================================================ */
const SEATS_TOTAL = 15;
let seatsFilled = 0;
const seatsFilledFallback = 0; // فقط وقتی Supabase وصل نیست

/* ============================================================
   RENDER
   ============================================================ */
function renderContent(lang){
  const d = DICT[lang];

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(d[key] !== undefined) el.innerHTML = d[key];
  });

  // hero flowchart labels (previously hardcoded, stayed Persian in Kurdish mode)
  document.getElementById('fn1a').textContent = d.flow1_label;
  document.getElementById('fn1b').textContent = d.flow1_sub;
  document.getElementById('fn2a').textContent = d.flow2_label;
  document.getElementById('fn2b').textContent = d.flow2_sub;
  document.getElementById('fn3a').textContent = d.flow3_label;
  document.getElementById('fn3b').textContent = d.flow3_sub;
  document.getElementById('fn4a').textContent = d.flow4_label;
  document.getElementById('fn4b').textContent = d.flow4_sub;

  // audience
  const audWrap = document.getElementById('audienceGrid');
  audWrap.innerHTML = d.audience.map((t,i)=>`
    <div class="aud-card"><div class="mark">${String(i+1).padStart(2,'0')}</div><p>${t}</p></div>
  `).join('');

  // parts nav
  document.getElementById('partsNav').innerHTML = d.parts.map(p=>`<span class="part-chip">${p}</span>`).join('');

  // syllabus track
  const track = document.getElementById('syllabusTrack');
  let lastPart = -1;
  track.innerHTML = d.sessions.map((s,i)=>{
    let partLabel = '';
    if(s.part !== lastPart){ partLabel = `<div class="session-part-label show">${d.parts[s.part]}</div>`; lastPart = s.part; }
    return `
    <div class="session">
      <div class="session-node">${String(i+1).padStart(2,'0')}</div>
      <div>
        ${partLabel}
        <div class="session-card">
          <h3>${s.title}</h3>
          <div class="session-topics">${s.topics.map(t=>`<span class="topic-tag">${t}</span>`).join('')}</div>
          <div class="session-ex"><b>${lang==='fa'?'تمرین:':'ڕاهێنان:'}</b><span>${s.ex}</span></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // project features
  document.getElementById('projFeatures').innerHTML = d.proj_features.map(f=>`
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>${f}</li>
  `).join('');

  // formula
  document.getElementById('formulaRow').innerHTML = d.formula.map((f,i)=>
    `<span class="step">${f}</span>` + (i<d.formula.length-1 ? `<span class="arrow">${lang==='fa'?'←':'←'}</span>`:'')
  ).join('');

  // method grid
  document.getElementById('methodGrid').innerHTML = d.method.map(m=>`
    <div class="method-cell"><b>${m.t}</b><span>${m.s}</span></div>
  `).join('');

  // days / times — preserve checked state by index when language re-renders
  const prevDays = Array.from(document.querySelectorAll('#daysGrid input[type="checkbox"]')).map(i=>i.checked);
  const prevTimes = Array.from(document.querySelectorAll('#timesGrid input[type="checkbox"]')).map(i=>i.checked);

  document.getElementById('daysGrid').innerHTML = d.days.map((day,i)=>`
    <label class="check-item${prevDays[i]?' is-on':''}">
      <input type="checkbox" name="days[]" value="${day}" ${prevDays[i]?'checked':''}>
      <span>${day}</span>
    </label>
  `).join('');
  document.getElementById('timesGrid').innerHTML = d.times.map((t,i)=>`
    <label class="check-item${prevTimes[i]?' is-on':''}">
      <input type="checkbox" name="times[]" value="${t}" ${prevTimes[i]?'checked':''}>
      <span>${t}</span>
    </label>
  `).join('');

  bindCheckItems();

  // instructor badges
  document.getElementById('instructorBadges').innerHTML = d.instructor_badges.map(b=>`
    <span class="instructor-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>${b}</span>
  `).join('');

  renderPricing(lang);
}

function bindCheckItems(){
  document.querySelectorAll('#daysGrid .check-item, #timesGrid .check-item').forEach(label=>{
    const input = label.querySelector('input[type="checkbox"]');
    if(!input || input.dataset.bound === '1') return;
    input.dataset.bound = '1';
    const sync = ()=> label.classList.toggle('is-on', input.checked);
    input.addEventListener('change', sync);
    sync();
  });
}

/* ============ PRICING / SEATS RENDER ============ */
function renderPricing(lang){
  const d = DICT[lang];
  const isFull = seatsFilled >= SEATS_TOTAL;
  const seatsLeft = Math.max(SEATS_TOTAL - seatsFilled, 0);

  const card1 = document.getElementById('priceCard1');
  const card2 = document.getElementById('priceCard2');
  const badge1 = document.getElementById('price1BadgeEl');
  card1.classList.toggle('is-full', isFull);
  card1.classList.toggle('featured', !isFull);
  card2.classList.toggle('featured', isFull);
  badge1.textContent = isFull ? d.price1_full_badge : d.price1_badge;

  const box = document.getElementById('regPriceBox');
  box.classList.toggle('is-full', isFull);
  if(isFull){
    box.innerHTML = `
      <div>
        <div class="rp-label">${d.reg_price_title}</div>
        <div class="rp-amount">${d.reg_price_full_title}</div>
      </div>
      <div class="rp-seats">${d.reg_price_full_note}</div>
    `;
  } else {
    box.innerHTML = `
      <div>
        <div class="rp-label">${d.reg_price_title}</div>
        <div class="rp-amount">${d.price1_amount}<span class="unit">${d.price_unit}</span></div>
      </div>
      <div class="rp-seats">${seatsLeft} ${d.seats_left_label}</div>
    `;
  }
}

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang === 'fa' ? 'fa' : 'ckb';
  document.documentElement.dir = 'rtl';
  document.getElementById('btnFa').classList.toggle('active', lang==='fa');
  document.getElementById('btnCkb').classList.toggle('active', lang==='ckb');
  renderContent(lang);
  localStorage.setItem('site-lang', lang);
}

/* ============ THEME ============ */
function applyTheme(mode){
  document.documentElement.classList.toggle('dark', mode==='dark');
  document.documentElement.classList.toggle('light', mode==='light');
  const icon = document.getElementById('themeIcon');
  icon.innerHTML = mode==='dark'
    ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  localStorage.setItem('site-theme', mode);
}
function toggleTheme(){
  const isDark = document.documentElement.classList.contains('dark');
  applyTheme(isDark ? 'light' : 'dark');
}

/* ============ SUPABASE (raw REST — no CDN SDK, no blocking) ============ */
function isSupabaseConfigured(){
  const cfg = window.SITE_CONFIG || {};
  return !!(cfg.supabaseUrl && cfg.supabaseAnonKey
    && !String(cfg.supabaseUrl).includes('YOUR_SUPABASE')
    && !String(cfg.supabaseAnonKey).includes('YOUR_SUPABASE'));
}

function supabaseHeaders(extra){
  const key = window.SITE_CONFIG.supabaseAnonKey;
  return Object.assign({
    apikey: key,
    Authorization: 'Bearer ' + key,
    'Content-Type': 'application/json'
  }, extra || {});
}

async function sbRpc(fnName, body){
  const url = window.SITE_CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/' + fnName;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(url, {
      method:'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify(body || {}),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error(await res.text());
    return await res.json();
  }finally{
    clearTimeout(timer);
  }
}

async function sbInsert(table, row){
  const url = window.SITE_CONFIG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/' + table;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const res = await fetch(url, {
      method:'POST',
      headers: supabaseHeaders({ Prefer:'return=minimal' }),
      body: JSON.stringify(row),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error(await res.text());
  }finally{
    clearTimeout(timer);
  }
}

async function refreshSeatCount(){
  if(!isSupabaseConfigured()){
    seatsFilled = seatsFilledFallback;
    renderPricing(currentLang);
    return;
  }
  try{
    const data = await sbRpc('registration_count');
    seatsFilled = Number(data) || 0;
  }catch(err){
    console.warn('Could not load seat count:', err);
    seatsFilled = seatsFilledFallback;
  }
  renderPricing(currentLang);
}

/* ============ INIT ============ */
(function init(){
  const savedTheme = localStorage.getItem('site-theme') || 'dark';
  applyTheme(savedTheme);
  const savedLang = localStorage.getItem('site-lang') || 'fa';
  setLang(savedLang);

  const reveals = Array.from(document.querySelectorAll('.reveal'));
  // Show anything already on screen before enabling hide-animation
  reveals.forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < window.innerHeight + 80) el.classList.add('in');
  });
  document.documentElement.classList.add('js-ready');

  if('IntersectionObserver' in window){
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } });
    },{threshold:.08, rootMargin:'60px 0px'});
    reveals.forEach(el=>{ if(!el.classList.contains('in')) obs.observe(el); });
    setTimeout(()=>{ reveals.forEach(el=>el.classList.add('in')); }, 2000);
  } else {
    reveals.forEach(el=>el.classList.add('in'));
  }

  // seat count in background — never blocks first paint
  setTimeout(refreshSeatCount, 0);

  // hide sticky mobile CTA while registration section is on screen
  const formSection = document.getElementById('form');
  if(formSection && 'IntersectionObserver' in window){
    const formObs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        document.body.classList.toggle('form-in-view', e.isIntersecting);
      });
    },{threshold:0.12, rootMargin:'-40px 0px'});
    formObs.observe(formSection);
  }
})();

/* ============ FORM SUBMIT (Supabase REST) ============ */
const REG_DONE_KEY = 'agrin-reg-done';
const regForm = document.getElementById('regForm');
const formMsg = document.getElementById('formMsg');
const formPanel = document.getElementById('formPanel');

function normalizePhone(raw){
  const digits = {
    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
    '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'
  };
  let s = String(raw || '').replace(/[۰-۹٠-٩]/g, ch => digits[ch] || ch).replace(/\D/g, '');
  if(s.startsWith('98') && s.length === 12) s = '0' + s.slice(2);
  if(s.startsWith('9') && s.length === 10) s = '0' + s;
  return s;
}

function isAlreadyRegistered(){
  return localStorage.getItem(REG_DONE_KEY) === '1';
}

function markRegisteredLocal(){
  localStorage.setItem(REG_DONE_KEY, '1');
}

function applyRegisteredState(){
  if(!formPanel) return;
  const done = isAlreadyRegistered();
  formPanel.classList.toggle('is-registered', done);
  document.body.classList.toggle('is-registered', done);
}

function isUniqueViolation(err){
  const msg = String(err && err.message || err || '');
  return /23505|duplicate key|unique constraint|already exists/i.test(msg);
}

applyRegisteredState();

regForm.addEventListener('submit', async function(e){
  e.preventDefault();
  if(isAlreadyRegistered()){
    applyRegisteredState();
    return;
  }

  formMsg.textContent = '';
  formMsg.className = '';

  const data = new FormData(regForm);
  // honeypot — bots fill this; humans never see it
  if((data.get('company') || '').toString().trim()){
    formMsg.textContent = DICT[currentLang].msg_ok;
    formMsg.className = 'ok';
    regForm.reset();
    return;
  }

  const name = (data.get('fullname') || '').toString().trim();
  const phone = normalizePhone(data.get('phone'));
  const ageRaw = data.get('age');
  const age = ageRaw === '' || ageRaw == null ? null : Number(ageRaw);

  if(!name || phone.length < 10 || !Number.isFinite(age) || age < 15 || age > 25){
    formMsg.textContent = DICT[currentLang].msg_err;
    formMsg.className = 'err';
    return;
  }

  const payload = {
    name,
    age: Number.isFinite(age) ? age : null,
    phone,
    email: (data.get('email') || '').toString().trim() || null,
    city: (data.get('city') || '').toString().trim() || null,
    experience: (data.get('experience') || '').toString() || null,
    days: data.getAll('days[]').map(String),
    times: data.getAll('times[]').map(String),
    notes: (data.get('notes') || '').toString().trim() || null,
    lang: currentLang
  };

  if(!isSupabaseConfigured()){
    formMsg.textContent = currentLang === 'fa'
      ? 'تنظیمات Supabase هنوز کامل نشده. فایل config.js را پر کنید.'
      : 'ڕێکخستنی Supabase تەواو نەکراوە. فایل config.js پڕبکەرەوە.';
    formMsg.className = 'err';
    return;
  }

  const btn = regForm.querySelector('button[type="submit"]');
  if(btn) btn.disabled = true;

  try{
    await sbInsert('registrations', payload);
    markRegisteredLocal();
    applyRegisteredState();
    await refreshSeatCount();
  }catch(err){
    console.error(err);
    if(isUniqueViolation(err)){
      formMsg.textContent = DICT[currentLang].msg_dup;
      formMsg.className = 'err';
    }else{
      formMsg.textContent = DICT[currentLang].msg_err;
      formMsg.className = 'err';
    }
  }finally{
    if(btn) btn.disabled = false;
  }
});
</script>
